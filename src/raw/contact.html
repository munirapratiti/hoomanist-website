<section id="contact" class="sec" style="padding:104px 0;background:#3B2145;color:#F6F2E8;">
    <div class="pad-x contact-row" style="max-width:1180px;margin:0 auto;padding:0 40px;display:flex;gap:64px;align-items:flex-start;">
      <div class="reveal" style="flex:1;min-width:0;">
        <div style="font-size:15px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#EE7E52;">{{let_s_talk}}</div>
        <h2 class="h2" style="font-size:46px;font-weight:700;line-height:1.05;letter-spacing:-0.02em;margin-top:16px;">{{let_s_build_better_ways_of_working}}</h2>
        <p style="font-size:19px;line-height:1.6;color:#B9C0CE;margin-top:20px;max-width:480px;">{{tell_us_where_your_business_is_today_and}}</p>
        <div style="display:flex;align-items:center;gap:14px;margin-top:26px;">
        <div style="margin-top:26px;display:flex;flex-direction:column;gap:22px;">
          <a href="#contact" data-mailto="main" style="display:flex;align-items:center;gap:16px;">{{email}}</a>
          <a href="https://instagram.com/hoomanist.id" target="_blank" style="display:flex;align-items:center;gap:16px;">{{instagram_hoomanist_id}}</a>
        </div>
      </div>
      <div class="reveal" style="flex:1;min-width:0;background:#FBF9F2;border-radius:24px;padding:40px;box-shadow:0 22px 50px rgba(0,0,0,0.22);">
        <div id="form-state">
          <form id="contact-form" style="display:flex;flex-direction:column;gap:18px;">
            <div>
              <label style="display:block;font-size:14px;font-weight:600;color:#42485A;margin-bottom:7px;">{{your_name}}</label>
              <input name="name" required="" class="field" style="width:100%;font-family:'Poppins',sans-serif;font-size:17px;color:#3B2145;background:#F6F2E8;border:1.5px solid #E2D9C5;border-radius:12px;padding:14px 16px;" placeholder="Jane Doe">
            </div>
            <div>
              <label style="display:block;font-size:14px;font-weight:600;color:#42485A;margin-bottom:7px;">{{company}}</label>
              <input name="company" class="field" style="width:100%;font-family:'Poppins',sans-serif;font-size:17px;color:#3B2145;background:#F6F2E8;border:1.5px solid #E2D9C5;border-radius:12px;padding:14px 16px;" placeholder="Studio or brand name">
            </div>
            <div>
              <label style="display:block;font-size:14px;font-weight:600;color:#42485A;margin-bottom:7px;">{{email_2}}</label>
              <input name="email" type="email" required="" class="field" style="width:100%;font-family:'Poppins',sans-serif;font-size:17px;color:#3B2145;background:#F6F2E8;border:1.5px solid #E2D9C5;border-radius:12px;padding:14px 16px;" placeholder="Work email address">
            </div>
            <div>
              <label style="display:block;font-size:14px;font-weight:600;color:#42485A;margin-bottom:7px;">{{what_s_on_your_mind}}</label>
              <textarea name="message" rows="4" class="field" style="width:100%;font-family:'Poppins',sans-serif;font-size:17px;color:#3B2145;background:#F6F2E8;border:1.5px solid #E2D9C5;border-radius:12px;padding:14px 16px;resize:vertical;" placeholder="Tell us a little about your team and what you're hoping to solve."></textarea>
            </div>
            <button type="submit" class="btn-primary" style="margin-top:4px;background:#3B2145;color:#F6F2E8;font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;padding:16px;border:none;border-radius:999px;cursor:pointer;">{{send_message}}</button>
          </form>
        </div>
        <div id="sent-state" hidden>
          <div style="text-align:center;padding:40px 10px;">
            <div style="width:72px;height:72px;border-radius:50%;background:#E6EFE9;display:flex;align-items:center;justify-content:center;margin:0 auto;"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1E7A6A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
            <div style="font-size:26px;font-weight:700;color:#3B2145;margin-top:22px;">{{opening_your_email}}</div>
            <p style="font-size:18px;color:#5C6473;line-height:1.55;margin-top:10px;">{{your_message_should_pop_up_in_your_email}}</p>
          </div>
        </div>
      </div>
    </div>
  </section>
