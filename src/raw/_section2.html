<section class="pad-x" style="max-width:1180px;margin:0 auto;padding:0 40px 90px;">

        <div class="tilt" style="border:1px solid #E5DCC8;border-radius:14px;overflow:hidden;background:#FBF9F2;">
          <div style="height:66px;display:flex;align-items:center;justify-content:center;padding:14px 22px;background:#fff;border-bottom:1px solid #E5DCC8;"><img loading="lazy" src="assets/logo-sosplan.png" alt="Sosplan" style="max-width:100%;max-height:100%;object-fit:contain;display:block;"></div>
          <div style="padding:10px 16px;font-size:13px;color:#5C6473;">{{every_hire_since_2022_plus_culture_and_r}}</div>
        </div>

        <div class="tiltr" style="border:1px solid #E5DCC8;border-radius:14px;overflow:hidden;background:#FBF9F2;">
          <div style="height:66px;overflow:hidden;"><img loading="lazy" src="assets/logo-padel.png" alt="360 Padel" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
          <div style="padding:10px 16px;font-size:13px;color:#5C6473;">{{partner_brand_and_creative_team_support}}</div>
        </div>

        <div class="tilt" style="border:1px solid #145261;border-radius:14px;overflow:hidden;background:#145261;">
          <div style="height:66px;overflow:hidden;"><img loading="lazy" src="assets/logo-experia.png" alt="Experia" style="width:100%;height:100%;object-fit:contain;display:block;"></div>
          <div style="padding:10px 16px;font-size:13px;color:#B9C0CE;">{{partner_creative_people_partnership}}</div>
        </div>

        <div class="tiltr" style="border:1px solid #E5DCC8;border-radius:14px;overflow:hidden;background:#FBF9F2;">
          <div style="height:66px;display:flex;align-items:center;justify-content:center;padding:14px 22px;background:#fff;border-bottom:1px solid #E5DCC8;"><img loading="lazy" src="assets/logo-byu.png" alt="by.U" style="max-width:100%;max-height:100%;object-fit:contain;display:block;"></div>
          <div style="padding:10px 16px;font-size:13px;color:#5C6473;">{{creative_recruitment_and_team_developmen}}</div>
        </div>

      </div>
    </div>
  <!-- Pita foto beranda. Memakai kelas .galeri yang sama dengan halaman
       lain supaya bentuk dan tone-nya seragam di seluruh situs. -->
  <div class="galeri reveal" style="margin-top:44px;">
    <figure><img loading="lazy" src="assets/beranda-01.jpg" alt="{{beranda_photo_1_alt}}" style="filter:brightness(0.84) contrast(1.06) saturate(1.06);object-position:50% 50%;"></figure>
    <figure><img loading="lazy" src="assets/beranda-02.jpg" alt="{{beranda_photo_2_alt}}" style="filter:brightness(0.91) contrast(1.06) saturate(1.06);object-position:50% 50%;"></figure>
    <figure><img loading="lazy" src="assets/beranda-03.jpg" alt="{{beranda_photo_3_alt}}" style="filter:brightness(0.98) contrast(1.06) saturate(1.06);object-position:50% 50%;"></figure>
  </div>
  <div style="font-size:14px;color:#A89F88;margin-top:12px;">{{beranda_gallery_caption}}</div>
</section>
